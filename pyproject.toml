[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-agents"
version = "0.2.0"
description = "Domain-agnostic multi-agent RFP response platform (FastAPI + Groq + pgvector)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.0",
  "ddgs>=9.0.0",
  "fastapi>=0.115.0",
  "groq>=0.30.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.1",
  "redis>=5.0.8",
  "reportlab>=4.0.0",
  "requests>=2.31.0",
  "SQLAlchemy>=2.0.36",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
# In-process embeddings (pulls in torch, ~GBs). Docker and local dev install this; Vercel does not,
# and uses RFP_EMBEDDING_PROVIDER=remote instead.
local = [
  "sentence-transformers>=2.7.0",
]
# Legacy Streamlit UI (ui/). The default UI is the web app in web/, served by the API.
ui = [
  "pandas>=2.0.0",
  "streamlit>=1.35.0",
]
# Legacy local fine-tuning pipeline (src/rfp_mistral). Not needed for the Groq-backed platform.
training = [
  "datasets>=2.18.0",
  "faiss-cpu>=1.8.0",
  "peft>=0.10.0",
  "torch>=2.2.0",
  "transformers>=4.39.0",
  "trl>=0.8.6",
]
dev = [
  "fakeredis[lua]>=2.20.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ui"]
addopts = "-q"
markers = [
  "postgres: needs a real Postgres with pgvector (set RFP_TEST_DATABASE_URL)",
]
