base_model: mistralai/Mistral-7B-Instruct-v0.2
dataset_path: data/processed/train.jsonl
output_dir: checkpoints/rfp-mistral-lora
max_seq_length: 4096
learning_rate: 0.0002
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.05
logging_steps: 10
save_steps: 100
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

